# The browser tier, bespoke the way calendar's and contacts' e2e jobs are:
# the official playwright template assumes standalone tests, while this
# app's suite drives a real Nextcloud — login, the admin settings page, the
# card's round trip through the two endpoints. One job: a PostgreSQL server
# with the app installed (stable34, the version the manifest pins — the
# phpunit legs derive theirs from the version matrix), the card built, and
# chromium against PLAYWRIGHT_BASE_URL.
#
# SPDX-FileCopyrightText: 2026 Néfix Estrada
# SPDX-License-Identifier: AGPL-3.0-or-later

name: e2e test

on:
  pull_request:
    paths:
      - '.github/workflows/e2e-test.yml'
      - 'appinfo/**'
      - 'lib/**'
      - 'src/**'
      - 'playwright/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

concurrency:
  group: e2e-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ghcr.io/nextcloud/continuous-integration-postgres-16:latest # zizmor: ignore[unpinned-images]
        ports:
          - 4444:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: stable34

      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: apps/fts_sql

      - name: Checkout fulltextsearch apps
        run: |
          git clone --depth 1 -b stable34 https://github.com/nextcloud/fulltextsearch.git apps/fulltextsearch
          git clone --depth 1 -b stable34 https://github.com/nextcloud/files_fulltextsearch.git apps/files_fulltextsearch

      - name: Set up php 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, pgsql, pdo_pgsql
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove nextcloud/ocp
        working-directory: apps/fts_sql
        run: composer remove nextcloud/ocp --dev --no-scripts

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: apps/fts_sql

      - name: Set up Nextcloud
        env:
          DB_PORT: 4444
        run: |
          mkdir data
          ./occ maintenance:install --verbose --database=pgsql --database-name=nextcloud --database-host=127.0.0.1 --database-port=$DB_PORT --database-user=root --database-pass=rootpassword --admin-user admin --admin-pass admin
          # files_external: the same reason the phpunit legs enable it — a
          # CLI install leaves it disabled while the test bootstrap loads it.
          ./occ app:enable files_external
          ./occ app:enable fulltextsearch
          ./occ app:enable files_fulltextsearch
          ./occ app:enable --force fts_sql

      - name: Set up node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build the admin card
        working-directory: apps/fts_sql
        run: |
          npm ci
          npm run build

      - name: Run Nextcloud
        run: php -S localhost:8080 &

      - name: Playwright
        working-directory: apps/fts_sql
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
