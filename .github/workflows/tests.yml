#
# The integration tier from DESIGN.md ("Verification: two tiers, four
# engines"): a real Nextcloud against SQLite, PostgreSQL 16, MariaDB 11.4
# and MySQL 8.4, from the official continuous-integration-* images, running
# both suites there. The engine strategies' raw SQL and the artefact DDL are
# exercised on every engine; the SQLite leg is also the FTS5 capability
# probe's honest test (isUsable answers for whatever pdo_sqlite the runner
# provides). The static job runs the unit tier standalone, exactly like
# `nix develop` does locally.

name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: Psalm, code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up php 8.2
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, dom
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up dependencies
        run: composer install

      - name: Psalm
        run: vendor/bin/psalm --no-cache

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Composer validate
        run: composer validate --no-check-publish

      # The bundling pipeline of DESIGN.md's Milestone 3, proven before the
      # first runtime library arrives: a scratch path-repository project is
      # scoped with the app's real prefix and the classes have to land in
      # lib/Vendor, where Nextcloud's autoloader serves them. Network-free.
      - name: Vendor scoping self-test
        run: composer run test:scoping

  engines:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Services cannot be conditional per matrix leg, so all three database
    # engines run beside every leg and each leg connects to its own; the
    # SQLite leg uses none of them. Distinct host ports: mysql and mariadb
    # would otherwise both claim 4444.
    services:
      postgres:
        image: ghcr.io/nextcloud/continuous-integration-postgres-16:latest # zizmor: ignore[unpinned-images]
        ports:
          - 4446:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5

      mariadb:
        image: ghcr.io/nextcloud/continuous-integration-mariadb-11.4:latest # zizmor: ignore[unpinned-images]
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        # MariaDB > 10.4 ships mariadb-admin; mysqladmin is gone, and a
        # health command that does not exist keeps the container unhealthy
        # and fails the whole job at "Initialize containers".
        options: --health-cmd="mariadb-admin ping" --health-interval 5s --health-timeout 2s --health-retries 10

      mysql:
        image: ghcr.io/nextcloud/continuous-integration-mysql-8.4:latest # zizmor: ignore[unpinned-images]
        ports:
          - 4445:3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        options: --health-cmd="mysqladmin ping" --health-interval 5s --health-timeout 2s --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLite
            php-extensions: 'sqlite3, pdo_sqlite'
            install-args: '--database=sqlite'
          - name: PostgreSQL 16
            php-extensions: 'pgsql, pdo_pgsql'
            install-args: '--database=pgsql --database-name=nextcloud --database-host=127.0.0.1 --database-port=4446 --database-user=root --database-pass=rootpassword'
          - name: MariaDB 11.4
            php-extensions: 'mysql, pdo_mysql'
            install-args: '--database=mysql --database-name=nextcloud --database-host=127.0.0.1 --database-port=4444 --database-user=root --database-pass=rootpassword'
          - name: MySQL 8.4
            php-extensions: 'mysql, pdo_mysql'
            install-args: '--database=mysql --database-name=nextcloud --database-host=127.0.0.1 --database-port=4445 --database-user=root --database-pass=rootpassword'

    steps:
      - name: Checkout server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
          repository: nextcloud/server
          ref: stable34

      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: apps/fts_sql

      # The framework this app is a platform of; the integration suite uses
      # fulltextsearch's own TestProvider, and enabling fts_sql without it
      # installed would leave the platform unreachable.
      - name: Checkout fulltextsearch apps
        run: |
          git clone --depth 1 -b stable34 https://github.com/nextcloud/fulltextsearch.git apps/fulltextsearch
          git clone --depth 1 -b stable34 https://github.com/nextcloud/files_fulltextsearch.git apps/files_fulltextsearch

      - name: Set up php 8.2
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: '8.2'
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, ${{ matrix.php-extensions }}
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The server checkout provides the OCP interfaces: the standalone
      # nextcloud/ocp dev package would shadow them with the wrong tree.
      - name: Set up dependencies
        working-directory: apps/fts_sql
        run: |
          composer remove nextcloud/ocp --dev --no-scripts
          composer install

      - name: Set up Nextcloud
        run: |
          mkdir data
          ./occ maintenance:install --verbose ${{ matrix.install-args }} --admin-user admin --admin-pass admin
          ./occ app:enable fulltextsearch
          ./occ app:enable files_fulltextsearch
          ./occ app:enable fts_sql

      - name: Run web server
        run: php -S localhost:8080 &

      - name: PHPUnit unit
        working-directory: apps/fts_sql
        run: composer run test:unit

      - name: PHPUnit integration
        working-directory: apps/fts_sql
        run: composer run test:integration
